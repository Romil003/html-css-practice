<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>QR Component View</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../html-css-practice/src/qr-component/qr.css">
    </head>
    <body>
        <div class="main-div">
            <div class="container-div">
                <div>
                    <img src="../html-css-practice/src/qr-component/assets/images/image-qr-code.png" alt="qr-image">
                </div>
                <div class="para-div">
                    <div class="para-1">
                        <span>Improve your front-end</span>
                        <span>skills by building projects</span>
                    </div>
                    <div class="para-2">
                        Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
